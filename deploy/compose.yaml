services:
  api:
    build: ../api
    restart: unless-stopped
    env_file: .env
    environment:
      # Caddy replaces any client-sent X-Forwarded-For with the real peer IP.
      CLIENT_IP_HEADER: x-forwarded-for
      TRUSTED_PROXY_HOPS: "1"
    volumes:
      - hf-cache:/home/user/.cache/huggingface
    expose:
      - "7860"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  hf-cache:
  caddy-data:
  caddy-config:
